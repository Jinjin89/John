[project]
name = "john"
version = "0.1.0"
description = "Headless A2A control plane and native harness bridges for generalist and specialist agents."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.3.1",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
john = "john.cli:main"

[dependency-groups]
dev = [
    "agent-client-protocol==1.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["john"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
